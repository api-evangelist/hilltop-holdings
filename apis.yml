description: >-
  Hilltop Holdings Inc. (NYSE: HTH, dual-listed on NYSE Texas) is a Dallas-based financial services
  holding company that operates through three wholly owned subsidiaries: PlainsCapital Bank, a Texas
  commercial bank; HilltopSecurities, a full-service investment bank covering public finance, wealth
  management, fixed income capital markets and structured finance; and PrimeLending, a national
  residential mortgage originator. Hilltop Holdings itself is a holding company, not a software
  vendor — it publishes no developer portal, no API reference and no machine-readable specification at
  the holding-company level, and the subsidiaries surface their technology as end-user platforms
  (MOmentum Advisor, HilltopBancSystems, loan servicing portals) rather than as public APIs. This
  profile records that public surface as it actually is: a corporate site that serves an llms.txt and
  nothing else a machine can consume.
